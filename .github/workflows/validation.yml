name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  system-monitor:
    name: System Monitor fixture validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system-monitor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: system-monitor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Exercise verifier adversarial cases
        working-directory: .
        run: node scripts/verify-system-monitor-baseline.mjs --self-test
      - name: Verify documented baseline test failures
        working-directory: .
        run: node scripts/verify-system-monitor-baseline.mjs
