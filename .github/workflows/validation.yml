name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  system-monitor:
    name: System Monitor fixture validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system-monitor
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: system-monitor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Exercise verifier adversarial cases
        working-directory: .
        run: node scripts/verify-system-monitor-baseline.mjs --self-test
      - name: Verify documented baseline test failures
        working-directory: .
        run: node scripts/verify-system-monitor-baseline.mjs
