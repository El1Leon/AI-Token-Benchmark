name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  system-monitor:
    name: System Monitor fixture validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: system-monitor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify documented baseline test failures
        working-directory: .
        run: node scripts/verify-system-monitor-baseline.mjs
